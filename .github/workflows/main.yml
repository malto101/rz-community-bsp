name: Yocto Build Pipeline

on:
  push:
    branches:
      - scarthgap
  pull_request:
    branches:
      - scarthgap

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout repository
      uses: actions/checkout@v2

    # Step 2: Set up dependencies (install Docker, kas, etc.)
    - name: Set up Docker
      run: |
        sudo apt-get update
        # Clean up any held or broken packages
        sudo apt-get autoremove -y
        sudo apt-get clean
        sudo apt-get install -f # Fix any broken dependencies
        # Unhold any held packages
        sudo apt-mark unhold containerd
        # Install docker and containerd.io
        sudo apt-get install -y docker.io containerd.io
        sudo usermod -aG docker $USER
        newgrp docker


    - name: Install kas
      run: |
        sudo apt-get install -y python3-pip
        pip3 install kas

    # Step 3: Build the Yocto image
    - name: Build Yocto Image
      run: |
        cd rz-community-bsp
        ./kas-container build kas/yocto/kirkstone.yml:kas/opt/debug.yml:kas/image/renesas-image-minimal.yml

    # Step 4: Save the output file as an artifact
    - name: Upload Build Output as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yocto-build-output
        path: build/  # Adjust this path to the actual output file location
